[project]
name = "mlops-risk-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.8", "numpy>=2.0", "pandas>=2.2", "scikit-learn>=1.5", "joblib>=1.4", "mlflow>=2.15", "pandera>=0.20", "evidently>=0.4"]
[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]
[tool.pytest.ini_options]
pythonpath = ["."]
[tool.ruff]
line-length = 100
target-version = "py312"

[project.scripts]
risk-drift = "scripts.drift:main"
